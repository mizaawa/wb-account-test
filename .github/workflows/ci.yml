name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Go tests
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: JavaScript tests
        run: node --test tests/*.test.js
      - name: Build
        run: go build -trimpath ./cmd/server
      - name: Compose configuration
        run: docker compose config --quiet
