name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Vue frontend
        run: |
          npm ci
          npm run build
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Go tests
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: JavaScript tests
        run: node --test tests/*.test.js
      - name: Browser regression tests
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          mkdir -p test-results
          go build -o test-results/server-test ./cmd/server
          npm run test:browser
          WB_TEST_PORT=18082 WB_TEST_BROWSER=webkit npm run test:browser
      - name: Build
        run: go build -trimpath ./cmd/server
      - name: Compose configuration
        run: docker compose config --quiet
