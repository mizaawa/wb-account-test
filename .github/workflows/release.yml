name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (for example v1.0.0)'
        required: true
        type: string
permissions:
  contents: write
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Vue frontend
        run: |
          npm ci
          npm run build
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --test tests/*.test.js
      - name: Browser regression tests
        run: |
          npx playwright install --with-deps chromium webkit
          mkdir -p test-results
          go build -o test-results/server-test ./cmd/server
          npm run test:browser
          WB_TEST_PORT=18082 WB_TEST_BROWSER=webkit npm run test:browser
  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-$GITHUB_REF_NAME}"
          [[ "$version" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || { echo "Invalid version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "semver=${version#v}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=WB Pulse
            org.opencontainers.image.description=WorkBuddy checker with a fixed same-origin relay
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image manifest
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.version.outputs.semver }}
      - name: Create release with deployment files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: WB Pulse ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            docker-compose.yaml
            README.md
            CHANGELOG.md
          body: |
            ## WB Pulse 2.0
            Vue 3 + Go 重写版，采用活力蓝色响应式主题。支持批量导入任意数量的凭证、导入进度动画及账号状态／用量分页展示。

            浏览器仅请求同源 Go 服务，由服务端转发至固定官方接口；不会因浏览器跨域策略而被 CORS 拦截。应用不保存凭证。升级后需重新导入凭证；每页显示 80 个账号，在线检测使用 8 个并发请求，并受本机内存、网络和官方限流影响。

            WBProxyCenter 导出的 `accounts` 清单可以直接导入，导出记录只在页面内展示，不保留清单令牌或参与在线验证。详细变更见附件 `CHANGELOG.md`。

            ## 快速部署
            下载本 Release 的 `docker-compose.yaml`，然后运行：
            ```sh
            docker compose pull && docker compose up -d
            ```
            镜像：`ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}`
            支持 linux/amd64 与 linux/arm64。
